[build]
  command = "cd \"dicom ui viewer/frontend\" && npm install --legacy-peer-deps && npm run build"
  publish = "dicom ui viewer/frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  PUPPETEER_SKIP_DOWNLOAD = "1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Access-Control-Allow-Origin = "*"
