<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>MerilView</title>
    <script>
      function forceHardRefresh() {
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('_v', Date.now().toString());
          window.location.replace(url.toString());
        } catch (_) {
          window.location.reload();
        }
      }

      function showErrorOnScreen(title, details) {
        console.error(`[${title}]`, details);
        let container = document.getElementById('merilview-error-overlay');
        if (!container) {
          container = document.createElement('div');
          container.id = 'merilview-error-overlay';
          container.style.cssText = 'color:#ff5555; padding:16px 20px; font-size:13px; font-family:monospace; z-index:999999; position:fixed; bottom:24px; right:24px; background:#1e1e1e; border:1px solid #ff4444; border-radius:8px; max-width:600px; max-height:400px; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,0.7);';
          document.body ? document.body.appendChild(container) : document.documentElement.appendChild(container);
        }
        container.innerHTML = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;"><h3 style="margin:0; font-size:14px; font-weight:bold; color:#ff6b6b;">' + title + '</h3><div style="display:flex; gap:6px;"><button onclick="forceHardRefresh()" style="background:#2563eb; border:none; color:#fff; cursor:pointer; padding:3px 10px; border-radius:4px; font-size:12px; font-weight:bold;">Update App</button><button onclick="this.parentElement.parentElement.parentElement.remove()" style="background:#333; border:none; color:#eee; cursor:pointer; padding:3px 8px; border-radius:4px; font-size:12px;">Dismiss</button></div></div><div style="line-height:1.4; word-break:break-word;">' + details + '</div>';
      }
      
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('[Global Error]', msg, url, lineNo, error);
        return false;
      };
      
      window.addEventListener("unhandledrejection", function(event) {
        console.error('[Unhandled Rejection]', event.reason);
      });

      window.addEventListener("vite:preloadError", function(event) {
        event.preventDefault();
        forceHardRefresh();
      });
      
      // Catch ES module load errors (which happen when a new deployment has updated script hashes)
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
          const key = 'merilview_reload_attempt';
          const lastAttempt = parseInt(sessionStorage.getItem(key) || '0', 10);
          if (Date.now() - lastAttempt > 6000) {
            sessionStorage.setItem(key, Date.now().toString());
            forceHardRefresh();
            return;
          }
          showErrorOnScreen('New Version Available', 'A new version of MerilView was deployed. Tap <b>Update App</b> to load the latest release.');
        }
      }, true); // Use capture phase
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#1e1e1e] text-[#e5e5e5] overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
